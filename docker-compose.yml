services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      HTTP_PORT: ${PORT:-8080}
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-2s}
      PROVIDER_RATE_LIMIT: ${PROVIDER_RATE_LIMIT:-10}
      STORE_DRIVER: redis
      CACHE_TTL: ${CACHE_TTL:-2m}
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10