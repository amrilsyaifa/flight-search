openapi: 3.0.3
info:
  title: Flight Search API
  version: 1.0.0

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  
  /api/v1/flights/search:
    post:
      operationId: searchFlights
      summary: Search flights across all providers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              origin: CGK
              destination: DPS
              departureDate: "2025-12-15"
              returnDate: null
              passengers: 1
              cabinClass: economy
              filters:
                maxPrice: 1000000
                maxStops: 0
              sort:
                by: price
                order: asc

      responses:
        "200":
          description: Aggregated results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    CabinClass:
      type: string
      enum: [economy, premium_economy, business, first]

    SearchRequest:
      type: object
      required: [origin, destination, departureDate, passengers, cabinClass]
      properties:
        origin:
          type: string
          example: CGK
        destination:
          type: string
          example: DPS
        departureDate:
          type: string
          format: date
        returnDate:
          type: string
          format: date
          nullable: true
        passengers:
          type: integer
          minimum: 1
          maximum: 9
        cabinClass:
          $ref: "#/components/schemas/CabinClass"
        filters:
          $ref: "#/components/schemas/SearchFilters"
        sort:
          $ref: "#/components/schemas/SortOption"

    SearchResponse:
      type: object
      required: [search_criteria, metadata, flights]
      properties:
        search_criteria:
          x-order: 1
          $ref: "#/components/schemas/SearchCriteria"
        metadata:
          x-order: 2
          $ref: "#/components/schemas/SearchMetadata"
        flights:
          type: array
          x-order: 3
          description: Outbound flights (origin -> destination).
          items:
            $ref: "#/components/schemas/Flight"
        return_flights:
          type: array
          x-order: 4
          description: Only for round trips (returnDate set) - flights destination -> origin.
          items:
            $ref: "#/components/schemas/Flight"

    SearchCriteria:
      type: object
      required: [origin, destination, departure_date, passengers, cabin_class]
      properties:
        origin:
          type: string
        destination:
          type: string
        departure_date:
          type: string
          format: date
        return_date:
          type: string
          format: date
          nullable: true
        passengers:
          type: integer
        cabin_class:
          $ref: "#/components/schemas/CabinClass"

    SearchMetadata:
      type: object
      required: [total_results, providers_queried, providers_succeeded, providers_failed, search_time_ms, cache_hit]
      properties:
        total_results:
          type: integer
        providers_queried:
          type: integer
        providers_succeeded:
          type: integer
        providers_failed:
          type: integer
        search_time_ms:
          type: integer
          format: int64
        cache_hit:
          type: boolean

    Flight:
      type: object
      required: [id, provider, airline, flight_number, departure, arrival, duration, stops, price, available_seats, cabin_class, aircraft, amenities, baggage]
      properties:
        id:
          x-order: 1
          type: string
        provider:
          x-order: 2
          type: string
        airline:
          x-order: 3
          $ref: "#/components/schemas/Airline"
        flight_number:
          x-order: 4
          type: string
        departure:
          x-order: 5
          $ref: "#/components/schemas/FlightPoint"
        arrival:
          x-order: 6
          $ref: "#/components/schemas/FlightPoint"
        duration:
          x-order: 7
          $ref: "#/components/schemas/Duration"
        stops:
          x-order: 8
          type: integer
        price:
          x-order: 9
          $ref: "#/components/schemas/Price"
        available_seats:
          x-order: 10
          type: integer
        cabin_class:
          x-order: 11
          $ref: "#/components/schemas/CabinClass"
        aircraft:
          x-order: 12
          type: string
          nullable: true
        amenities:
          x-order: 13
          type: array
          items:
            type: string
        baggage:
          x-order: 14
          $ref: "#/components/schemas/Baggage"

    Airline:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string

    FlightPoint:
      type: object
      required: [airport, city, datetime, timestamp]
      properties:
        airport:
          type: string
        city:
          type: string
        datetime:
          type: string
          format: date-time
        timestamp:
          type: integer
          format: int64

    Duration:
      type: object
      required: [total_minutes, formatted]
      properties:
        total_minutes:
          type: integer
        formatted:
          type: string

    Price:
      type: object
      required: [amount, currency, formatted]
      properties:
        amount:
          x-order: 1
          type: integer
          format: int64
        currency:
          x-order: 2
          type: string
        formatted:
          x-order: 3
          type: string
          description: Display string with thousands separators.
          example: Rp 485.000

    Baggage:
      type: object
      required: [carry_on, checked]
      properties:
        carry_on:
          type: string
        checked:
          type: string

    SearchFilters:
      type: object
      description: All filters are optional. Omitted means no constraint.
      properties:
        minPrice:
          type: integer
          format: int64
          minimum: 0
        maxPrice:
          type: integer
          format: int64
          minimum: 0
        maxStops:
          type: integer
          minimum: 0
          description: 0 means direct flights only.
        departureTimeFrom:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time at the origin airport (HH:MM).
          example: "06:00"
        departureTimeTo:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "12:00"
        arrivalTimeFrom:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time at the destination airport (HH:MM).
        arrivalTimeTo:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        airlines:
          type: array
          description: Airline IATA codes, e.g. ["GA", "JT"].
          items:
            type: string
        maxDurationMinutes:
          type: integer
          minimum: 1

    SortOption:
      type: object
      properties:
        by:
          type: string
          enum: [best_value, price, duration, departure_time, arrival_time]
          default: best_value
          description: best_value combines price, total duration and number of stops.
        order:
          type: string
          enum: [asc, desc]
          default: asc

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string